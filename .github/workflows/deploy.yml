name: Deploy Lead Forge to CF Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Worker tests
        run: npm test

      - name: Validate mapped environment
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const required = [
              "CF_API_TOKEN",
              "CF_ACCOUNT_ID",
              "CF_D1_DATABASE_ID",
              "SERPAPI_KEY",
              "GEMINI_API_KEY",
            ];
            const missing = required.filter((key) => !process.env[key]);
            if (missing.length) throw new Error(`Missing GitHub Actions secrets: ${missing.join(", ")}`);
            const config = readFileSync("wrangler.toml", "utf8");
            const configuredDatabaseId = config.match(/database_id\s*=\s*"([^"]+)"/)?.[1];
            if (configuredDatabaseId !== process.env.CF_D1_DATABASE_ID) {
              throw new Error("CF_D1_DATABASE_ID does not match wrangler.toml.");
            }
          '
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply serpapi --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Configure Worker secrets
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const runtimeKeys = [
              "SERPAPI_KEY",
              "UNSPLASH_ACCESS_KEY",
              "GEMINI_API_KEY",
              "GEMINI_MODEL",
            ];
            const missing = ["SERPAPI_KEY", "GEMINI_API_KEY"].filter((key) => !process.env[key]);
            if (missing.length) throw new Error(`Missing GitHub Actions secrets: ${missing.join(", ")}`);
            const secrets = Object.fromEntries(runtimeKeys.map((key) => [key, process.env[key] || null]));
            writeFileSync(".worker-secrets.json", JSON.stringify(secrets), { mode: 0o600 });
          '
          npx wrangler secret bulk .worker-secrets.json
          rm -f .worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
